# Release Notes 分类：GitHub 只按 PR 标签归类，不认提交前缀（docs/git-workflow.md §7）
# 标签名必须与仓库里实际存在的标签一致（gh label list 可查），写错等于不分类。
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 新功能
      labels:
        - enhancement
    - title: 修复
      labels:
        - bug
    - title: 文档与规范
      labels:
        - documentation
    - title: 其他
      labels:
        - '*'

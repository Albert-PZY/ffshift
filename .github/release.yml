# Release Notes 分类：GitHub 只按 PR 标签归类，不认提交前缀（docs/git-workflow.md §7）
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 新功能
      labels:
        - enhancement
        - Semver-Minor
    - title: 修复
      labels:
        - bug
        - Semver-Patch
    - title: 破坏性改动
      labels:
        - breaking-change
        - Semver-Major
    - title: 文档与规范
      labels:
        - docs
        - chore
    - title: 其他
      labels:
        - '*'
